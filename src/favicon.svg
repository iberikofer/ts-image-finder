<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e55d87" />
      <stop offset="100%" stop-color="#5fc3e4" />
    </linearGradient>
    <linearGradient id="lensShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#brandGradient)" />
  
  <!-- Camera / Finder Body Accent -->
  <rect x="13" y="19" width="38" height="28" rx="7" fill="#ffffff" fill-opacity="0.18" />
  
  <!-- Search / Lens Main Ring -->
  <circle cx="29" cy="33" r="12.5" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Lens Inner Reflection -->
  <circle cx="29" cy="33" r="9" fill="url(#lensShine)" />
  
  <!-- Viewfinder Flash / Shutter Dot -->
  <circle cx="43.5" cy="25.5" r="2" fill="#ffffff" />
  
  <!-- Magnifier Handle -->
  <line x1="38" y1="42" x2="48" y2="52" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
</svg>
